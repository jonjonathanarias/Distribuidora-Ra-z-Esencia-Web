<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta Corriente y Semáforo Financiero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="js/config.js"></script>
</head>
<body class="bg-light" x-data="ccApp()" x-init="init()">

<nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" :href="volverUrl">← Volver al Dashboard</a>
        <span class="text-white small">Módulo Financiero y Control de Saldos</span>
    </div>
</nav>

<div class="container mb-5">
    <!-- Selector de Experta por Nombre (Reemplaza el input por ID) -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white d-flex justify-content-between align-items-center py-3 flex-wrap gap-3">
            <div>
                <h5 class="fw-bold mb-0 text-primary">Cuenta Corriente - <span x-text="nombreExpertoSeleccionado"></span></h5>
                <span class="badge bg-secondary mt-1" x-text="expertoId ? ('ID Seleccionado: ' + expertoId) : 'Seleccione una experta'"></span>
            </div>
            <div class="d-flex gap-2 align-items-center">
                <label class="small fw-semibold text-muted">Experta:</label>
                <select class="form-select form-select-sm" style="min-width: 280px;" x-model.number="expertoId" @change="cargarCuenta()">
                    <option value="">-- Seleccione una experta --</option>
                    <template x-for="exp in listaExpertas" :key="exp.id">
                        <option :value="exp.id" x-text="exp.nombre + ' (' + (exp.codigo_integrante || 'Sin Código') + ')'"></option>
                    </template>
                </select>
            </div>
        </div>
        
        <!-- Tarjeta de Resumen Financiero y Semáforo -->
        <div class="card-body bg-light border-top border-bottom p-4">
            <div class="alert alert-warning mb-0" x-show="mensajeError" x-text="mensajeError"></div>
            <div class="row align-items-center g-3">
                <div class="col-md-6">
                    <span class="text-muted small d-block">Saldo Actual en Cuenta</span>
                    <h2 class="fw-bold mb-0" :class="saldoActual >= 0 ? 'text-success' : 'text-danger'" x-text="'$' + saldoActual.toFixed(2)"></h2>
                </div>
                <div class="col-md-6 text-md-end">
                    <span class="text-muted small d-block">Semáforo Financiero</span>
                    <span class="badge fs-6 px-3 py-2 mt-1" 
                          :class="saldoActual >= 0 ? 'bg-success text-white' : 'bg-danger text-white'"
                          x-text="semaforoTexto">
                    </span>
                </div>
            </div>
        </div>

        <!-- Tabla de Historial de Movimientos -->
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light small text-uppercase">
                        <tr>
                            <th>ID Mov.</th>
                            <th>Tipo de Movimiento</th>
                            <th>Descripción</th>
                            <th class="text-end">Monto ($)</th>
                            <th class="text-end">Saldo Resultante ($)</th>
                            <th class="text-center">Comprobante PDF</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="mov in movimientos" :key="mov.id">
                            <tr>
                                <td class="fw-bold" x-text="'#' + mov.id"></td>
                                <td>
                                    <span class="badge" 
                                          :class="{
                                              'bg-danger': mov.tipo_movimiento === 'deuda_factura',
                                              'bg-success': mov.tipo_movimiento === 'pago_recibido',
                                              'bg-info text-dark': mov.tipo_movimiento === 'comision_liderazgo',
                                              'bg-warning text-dark': mov.tipo_movimiento === 'ajuste_manual'
                                          }" x-text="mov.tipo_movimiento.toUpperCase()"></span>
                                </td>
                                <td class="small fw-semibold text-secondary" x-text="mov.descripcion"></td>
                                <td class="text-end fw-bold" :class="mov.monto >= 0 ? 'text-success' : 'text-danger'" x-text="'$' + mov.monto.toFixed(2)"></td>
                                <td class="text-end fw-bold text-dark" x-text="'$' + mov.saldo_resultante.toFixed(2)"></td>
                                <td class="text-center">
                                    <button class="btn btn-outline-secondary btn-sm fw-semibold" @click="descargarPdf(mov.id)">
                                        📄 Descargar Recibo
                                    </button>
                                </td>
                            </tr>
                        </template>
                        <template x-if="movimientos.length === 0">
                            <tr>
                                <td colspan="6" class="text-center text-muted py-4">Seleccione una experta del menú superior para consultar su cuenta corriente.</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
function ccApp() {
    return {
        expertoId: '',
        nombreExpertoSeleccionado: 'Seleccione una experta',
        listaExpertas: [],
        saldoActual: 0.00,
        semaforoTexto: '🟢 VERDE (Al día)',
        movimientos: [],
        volverUrl: 'dashboard.html',
        mensajeError: '',
        init() {
            const usr = localStorage.getItem('usuario');
            if (usr) {
                try {
                    const u = JSON.parse(usr);
                    this.volverUrl = u.rol === 'admin' ? 'dashboard.html' : 'dashboard_experto.html';
                } catch (e) { /* mantener dashboard.html */ }
            }
            verificarSesion();
            this.cargarListaExpertas();
        },
        async cargarListaExpertas() {
            try {
                // El backend devuelve solo las expertas que este usuario puede consultar:
                // admin -> todas; líder -> ella + su red directa; experta -> solo ella.
                const res = await fetch(`${CONFIG.API_BASE_URL}/red/mis-expertas`, {
                    headers: getAuthHeaders()
                });
                const data = await res.json();
                if (res.ok) {
                    this.listaExpertas = data.data || [];
                    // Si hay expertas, seleccionamos la primera por defecto automáticamente
                    if (this.listaExpertas.length > 0) {
                        this.expertoId = this.listaExpertas[0].id;
                        this.cargarCuenta();
                    }
                } else {
                    throw new Error(data.detail || 'No se pudo cargar el listado de expertas');
                }
            } catch (err) {
                console.error("Error al cargar lista de expertas:", err);
                this.listaExpertas = [];
            }
        },
        async cargarCuenta() {
            if (!this.expertoId) return;
            this.mensajeError = '';

            // Actualizamos el nombre visual de la experta seleccionada
            const expEncontrada = this.listaExpertas.find(e => e.id === parseInt(this.expertoId));
            if (expEncontrada) {
                this.nombreExpertoSeleccionado = `${expEncontrada.nombre} (${expEncontrada.codigo_integrante})`;
            }

            try {
                const res = await fetch(`${CONFIG.API_BASE_URL}/cuenta-corriente/${this.expertoId}`, {
                    headers: getAuthHeaders()
                });
                const data = await res.json();
                if (res.ok) {
                    this.saldoActual = data.saldo_actual || 0.00;
                    this.semaforoTexto = data.semaforo_financiero || '🟢 VERDE';
                    this.movimientos = data.historial_movimientos || [];
                } else {
                    throw new Error(data.detail || 'No se pudo cargar la cuenta');
                }
            } catch (err) {
                console.error(err);
                this.mensajeError = err.message || 'No se pudo cargar la cuenta corriente.';
                this.movimientos = [];
                this.saldoActual = 0.00;
            }
        },
        async descargarPdf(movimientoId) {
            try {
                const res = await fetch(`${CONFIG.API_BASE_URL}/cuenta-corriente/pdf/${movimientoId}`, {
                    headers: getAuthHeaders()
                });
                if (!res.ok) throw new Error('Error al generar el comprobante PDF');

                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `recibo_cuenta_${movimientoId}.pdf`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
            } catch (err) {
                alert(`Error al descargar el recibo: ${err.message}`);
            }
        }
    }
}
</script>
</body>
</html>
