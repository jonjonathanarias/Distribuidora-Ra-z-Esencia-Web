<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pedidos | REINO & Marzzan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="js/config.js"></script>
</head>
<body class="bg-light" x-data="misPedidosApp()" x-init="init()">

<nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard_experto.html">← Volver a mi Panel</a>
        <span class="text-white small">Seguimiento de Mis Pedidos y Faltantes</span>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold text-success mb-0">Historial y Estado de Mis Solicitudes</h4>
        <span class="badge bg-secondary fs-6" x-text="'Total Pedidos: ' + pedidos.length"></span>
    </div>

    <!-- Resumen financiero de todos mis pedidos -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <div class="small text-muted text-uppercase">Total facturado</div>
                    <div class="fs-5 fw-bold" x-text="'$' + totalFacturado.toLocaleString('es-AR', { minimumFractionDigits: 2 })"></div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <div class="small text-muted text-uppercase">Pagado</div>
                    <div class="fs-5 fw-bold text-success" x-text="'$' + totalPagado.toLocaleString('es-AR', { minimumFractionDigits: 2 })"></div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <div class="small text-muted text-uppercase">Saldo pendiente</div>
                    <div class="fs-5 fw-bold text-danger" x-text="'$' + totalSaldo.toLocaleString('es-AR', { minimumFractionDigits: 2 })"></div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <div class="small text-muted text-uppercase">Pedidos con saldo</div>
                    <div class="fs-5 fw-bold text-warning" x-text="pedidosConSaldo"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Listado de pedidos propios -->
    <div class="row g-4">
        <template x-for="p in pedidos" :key="p.pedido_id">
            <div class="col-12">
                <div class="card shadow-sm border-0 border-start border-4 border-success">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="fw-bold mb-0 text-dark" x-text="'Pedido #' + p.pedido_id"></h5>
                            <span class="badge bg-info text-dark mt-1" x-text="'Empresa: ' + p.empresa"></span>
                            <span class="badge mt-1 ms-1" :class="estadoPagoClase(p.estado_pago)" x-text="estadoPagoTexto(p.estado_pago)"></span>
                        </div>
                        <div>
                            <span class="badge fs-6 px-3 py-2"
                                  :class="estadoClase(p.estado)"
                                  x-text="'Estado: ' + estadoTexto(p.estado)"></span>
                        </div>
                    </div>
                    <div class="card-body">
                        <p class="text-muted small mb-3">Fecha límite del ciclo: <strong x-text="p.fecha_limite"></strong></p>

                        <div class="row g-2 mb-3">
                            <div class="col-6 col-md-3">
                                <div class="border rounded p-2 bg-light">
                                    <div class="small text-muted">Total pedido</div>
                                    <div class="fw-bold" x-text="'$' + (p.total || 0).toLocaleString('es-AR', { minimumFractionDigits: 2 })"></div>
                                </div>
                            </div>
                            <div class="col-6 col-md-3">
                                <div class="border rounded p-2 bg-light">
                                    <div class="small text-muted">Pagado</div>
                                    <div class="fw-bold text-success" x-text="'$' + (p.monto_pagado || 0).toLocaleString('es-AR', { minimumFractionDigits: 2 })"></div>
                                </div>
                            </div>
                            <div class="col-6 col-md-3">
                                <div class="border rounded p-2 bg-light">
                                    <div class="small text-muted">Saldo pendiente</div>
                                    <div class="fw-bold" :class="(p.saldo_pendiente || 0) > 0 ? 'text-danger' : 'text-success'" x-text="'$' + (p.saldo_pendiente || 0).toLocaleString('es-AR', { minimumFractionDigits: 2 })"></div>
                                </div>
                            </div>
                            <div class="col-6 col-md-3">
                                <div class="border rounded p-2 bg-light">
                                    <div class="small text-muted">Faltantes</div>
                                    <div class="fw-bold" :class="(p.total_faltantes || 0) > 0 ? 'text-danger' : 'text-success'" x-text="(p.total_faltantes || 0) + ' un.'"></div>
                                </div>
                            </div>
                        </div>

                        <h6 class="fw-bold text-secondary mb-2">Detalle de Artículos:</h6>
                        <div class="table-responsive">
                            <table class="table table-sm table-bordered align-middle mb-0">
                                <thead class="table-light small">
                                    <tr>
                                        <th>Producto / SKU</th>
                                        <th class="text-center">Solicitado</th>
                                        <th class="text-center">A Enviar / Entregado</th>
                                        <th class="text-center text-danger">Faltante (Pendiente)</th>
                                        <th class="text-end">Subtotal</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="item in p.detalles" :key="item.detalle_id">
                                        <tr>
                                            <td>
                                                <div class="fw-semibold" x-text="item.nombre_producto"></div>
                                                <div class="small text-muted" x-text="'SKU: ' + item.codigo_sku"></div>
                                            </td>
                                            <td class="text-center fw-bold" x-text="item.cantidad_pedida"></td>
                                            <td class="text-center text-success fw-bold" x-text="item.cantidad_entregada"></td>
                                            <td class="text-center">
                                                <template x-if="item.cantidad_faltante > 0">
                                                    <span class="badge bg-danger" x-text="item.cantidad_faltante + ' un.'"></span>
                                                </template>
                                                <template x-if="item.cantidad_faltante === 0">
                                                    <span class="text-muted small">Ninguno</span>
                                                </template>
                                            </td>
                                            <td class="text-end fw-semibold" x-text="'$' + ((item.subtotal !== undefined ? item.subtotal : item.precio_unitario * item.cantidad_pedida) || 0).toFixed(2)"></td>
                                        </tr>
                                    </template>
                                </tbody>
                                <tfoot class="table-light">
                                    <tr>
                                        <td colspan="4" class="text-end fw-bold text-uppercase small">Total del pedido</td>
                                        <td class="text-end fw-bold text-success" x-text="'$' + (p.total || 0).toLocaleString('es-AR', { minimumFractionDigits: 2 })"></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <template x-if="pedidos.length === 0">
            <div class="col-12 text-center py-5 text-muted bg-white rounded shadow-sm">
                <h5>Aún no has registrado ningún pedido.</h5>
                <p class="small">Cuando cargues solicitudes en el sistema, podrás ver su seguimiento detallado aquí.</p>
            </div>
        </template>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function misPedidosApp() {
    return {
        pedidos: [],
        get totalFacturado() {
            return this.pedidos.reduce((acc, p) => acc + (p.total || 0), 0);
        },
        get totalPagado() {
            return this.pedidos.reduce((acc, p) => acc + (p.monto_pagado || 0), 0);
        },
        get totalSaldo() {
            return this.pedidos.reduce((acc, p) => acc + (p.saldo_pendiente || 0), 0);
        },
        get pedidosConSaldo() {
            return this.pedidos.filter(p => (p.saldo_pendiente || 0) > 0.009).length;
        },
        estadoPagoTexto(estado) {
            const textos = {
                pagado: '✅ Pagado',
                parcial: '🟡 Pago parcial',
                pendiente: '🔴 No pagado',
                sin_importe: '⚪ Sin importe'
            };
            return textos[estado] || '⚪ Sin importe';
        },
        estadoPagoClase(estado) {
            const clases = {
                pagado: 'bg-success text-white',
                parcial: 'bg-warning text-dark',
                pendiente: 'bg-danger text-white',
                sin_importe: 'bg-secondary text-white'
            };
            return clases[estado] || 'bg-secondary text-white';
        },
        estadoTexto(estado) {
            const textos = {
                borrador: '📝 BORRADOR',
                pendiente: '⏳ PENDIENTE',
                aprobado: '📋 APROBADO',
                entrega_parcial: '⚠️ ENTREGA PARCIAL',
                entregado: '✅ ENTREGADO',
                facturado: '📄 FACTURADO',
                rechazado: '❌ RECHAZADO',
                recibido_faltantes_ajustados: '✅ ENTREGADO'
            };
            return textos[estado] || (estado || '').toUpperCase();
        },
        estadoClase(estado) {
            const clases = {
                borrador: 'bg-secondary text-white',
                pendiente: 'bg-warning text-dark',
                aprobado: 'bg-info text-dark',
                entrega_parcial: 'bg-warning text-dark',
                entregado: 'bg-success text-white',
                facturado: 'bg-primary text-white',
                rechazado: 'bg-danger text-white'
            };
            return clases[estado] || 'bg-secondary text-white';
        },
        init() {
            verificarSesion();
            this.cargarMisPedidos();
        },
        async cargarMisPedidos() {
            try {
                const res = await fetch(`${CONFIG.API_BASE_URL}/mis-pedidos/`, {
                    headers: getAuthHeaders()
                });
                const data = await res.json();
                if (res.ok) {
                    this.pedidos = data.pedidos || [];
                }
            } catch (err) {
                console.error("Error al cargar tus pedidos:", err);
            }
        }
    }
}
</script>
</body>
</html>
