<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:8000 http://localhost:8000; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1b4332">
    <title>Consolidado por Marca y Ciclo | Raíz & Esencia</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png" sizes="192x192">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link href="css/style.css?v=7" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.1/dist/cdn.min.js" integrity="sha384-GHFg+kjbwkV5Zd1wmxDjdvtA6PMCzkf9vf+Tw2vxhIOXe3eHhtcsKc0nRrrcOg/O" crossorigin="anonymous"></script>
    <script src="js/config.js?v=7"></script>
    <script src="js/app.js?v=7"></script>
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-light" x-data="consolidadoApp()" x-init="init()" x-cloak>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">← Volver al Panel Admin</a>
        <span class="text-white small">📊 Consolidado real por marca y ciclo</span>
        <button class="btn btn-outline-light btn-sm ms-auto" @click="cerrarSesion()">Cerrar Sesión</button>
    </div>
</nav>

<div class="container mb-5">
    <template x-if="mensajeError">
        <div class="alert alert-danger shadow-sm" role="alert" x-text="mensajeError"></div>
    </template>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <form class="row g-3 align-items-end" @submit.prevent="cargar()">
                <div class="col-md-2">
                    <label class="form-label small fw-semibold">Año</label>
                    <input type="number" class="form-control form-control-sm" x-model.number="anio" min="2000" max="2100" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold">Mes</label>
                    <select class="form-select form-select-sm" x-model.number="mes" required>
                        <template x-for="n in 12" :key="n">
                            <option :value="n" x-text="n"></option>
                        </template>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold">Quincena</label>
                    <select class="form-select form-select-sm" x-model.number="quincena">
                        <option value="0">Todas</option>
                        <option value="1">Q1 (1-15)</option>
                        <option value="2">Q2 (16-fin)</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary btn-sm w-100" :disabled="cargando">
                        <span x-show="!cargando">🔄 Consultar</span>
                        <span x-show="cargando" class="spinner-border spinner-border-sm"></span>
                    </button>
                </div>
                <div class="col-md-3">
                    <button type="button" class="btn btn-success btn-sm w-100" :disabled="exportando || !datos" @click="exportarExcel()">
                        <span x-show="!exportando">⬇️ Descargar Excel</span>
                        <span x-show="exportando" class="spinner-border spinner-border-sm"></span>
                    </button>
                </div>
            </form>
            <p class="small text-muted mt-3 mb-0">
                Los importes se calculan con <code>SUM/GROUP BY</code> sobre los pedidos persistidos,
                excluyendo borradores y rechazados. La fila <strong>TOTAL GENERAL</strong> del Excel
                coincide con estos totales.
            </p>
        </div>
    </div>

    <template x-if="datos">
        <div>
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm p-3">
                        <div class="small text-muted">Pedidos</div>
                        <div class="fs-4 fw-bold" x-text="datos.total.pedidos"></div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm p-3">
                        <div class="small text-muted">Unidades</div>
                        <div class="fs-4 fw-bold" x-text="datos.total.unidades"></div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm p-3">
                        <div class="small text-muted">PSD</div>
                        <div class="fs-4 fw-bold" x-text="money(datos.total.psd)"></div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm p-3 border-start border-4 border-success">
                        <div class="small text-muted">Total general</div>
                        <div class="fs-4 fw-bold text-success" x-text="money(datos.total.total)"></div>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm border-0 mb-4">
                <div class="card-header bg-white fw-bold py-3">Orden de Compra por marca y ciclo</div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light small text-uppercase">
                                <tr>
                                    <th>Marca</th><th>Ciclo</th><th>Período</th>
                                    <th class="text-center">Pedidos</th><th class="text-center">Unidades</th>
                                    <th class="text-end">PSD</th><th class="text-end">Total</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="f in datos.consolidado" :key="f.ciclo_id + '-' + f.marca">
                                    <tr>
                                        <td class="fw-semibold" x-text="f.marca_nombre || f.marca"></td>
                                        <td x-text="f.ciclo"></td>
                                        <td x-text="f.anio + '-' + String(f.mes).padStart(2, '0') + ' Q' + f.quincena"></td>
                                        <td class="text-center" x-text="f.pedidos"></td>
                                        <td class="text-center" x-text="f.unidades"></td>
                                        <td class="text-end" x-text="money(f.psd)"></td>
                                        <td class="text-end fw-semibold" x-text="money(f.total)"></td>
                                    </tr>
                                </template>
                            </tbody>
                            <tfoot class="table-light fw-bold">
                                <tr>
                                    <td colspan="3" class="text-end">TOTAL GENERAL</td>
                                    <td class="text-center" x-text="datos.total.pedidos"></td>
                                    <td class="text-center" x-text="datos.total.unidades"></td>
                                    <td class="text-end" x-text="money(datos.total.psd)"></td>
                                    <td class="text-end text-success" x-text="money(datos.total.total)"></td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                    <template x-if="!datos.consolidado.length">
                        <p class="text-muted small text-center py-3 mb-0">No hay pedidos computables para el período seleccionado.</p>
                    </template>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-white fw-bold py-3">Picking por experta</div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-sm table-hover align-middle mb-0">
                            <thead class="table-light small text-uppercase">
                                <tr>
                                    <th>Experta</th><th>Código</th><th>Marca</th><th>Ciclo</th>
                                    <th>Producto</th><th class="text-center">Unidades</th><th class="text-end">Total</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="(p, index) in datos.picking" :key="index">
                                    <tr>
                                        <td x-text="p.experta"></td>
                                        <td x-text="p.codigo_integrante || '—'"></td>
                                        <td x-text="p.marca"></td>
                                        <td x-text="p.ciclo"></td>
                                        <td x-text="p.producto"></td>
                                        <td class="text-center" x-text="p.unidades"></td>
                                        <td class="text-end" x-text="money(p.total)"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    <template x-if="!datos.picking.length">
                        <p class="text-muted small text-center py-3 mb-0">Sin productos para el período.</p>
                    </template>
                </div>
            </div>
        </div>
    </template>
</div>

<script>
function consolidadoApp() {
    const hoy = new Date();
    return {
        anio: hoy.getFullYear(),
        mes: hoy.getMonth() + 1,
        quincena: 0,
        datos: null,
        cargando: false,
        exportando: false,
        mensajeError: '',
        init() {
            if (!Sesion.requerirRol('admin')) return;
            this.cargar();
        },
        money(valor) {
            const n = Number(valor || 0);
            return '$' + n.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        },
        cerrarSesion() {
            Sesion.limpiar();
            window.location.href = 'index.html';
        },
        params() {
            return {
                anio: this.anio,
                mes: this.mes,
                quincena: this.quincena ? this.quincena : ''
            };
        },
        async cargar() {
            this.mensajeError = '';
            this.cargando = true;
            try {
                this.datos = await API.get('/consolidado', { params: this.params(), etag: true });
            } catch (err) {
                this.mensajeError = API.mensajeDeError(err);
                this.datos = null;
            } finally {
                this.cargando = false;
            }
        },
        async exportarExcel() {
            this.mensajeError = '';
            this.exportando = true;
            const nombre = `consolidado-${this.anio}-${String(this.mes).padStart(2, '0')}` +
                (this.quincena ? `-q${this.quincena}` : '') + '.xlsx';
            try {
                await API.descargarArchivo('/consolidado/excel', nombre, { params: this.params() });
            } catch (err) {
                this.mensajeError = API.mensajeDeError(err);
            } finally {
                this.exportando = false;
            }
        }
    }
}
</script>
</body>
</html>
