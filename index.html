<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Raíz & Esencia & Marzzan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="js/config.js"></script>
    <style>
        /* Estética corporativa basada en el logotipo de Raíz & Esencia */
        :root {
            --bs-primary: #1b4332;
            --bs-primary-rgb: 27, 67, 50;
        }
        body.bg-light {
            background-color: #fcfaf7 !important; /* Fondo marfil / crema cálido */
            color: #2b2b2b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            border: 1px solid #e3dec3 !important;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(27, 67, 50, 0.08) !important;
        }
        .btn-primary {
            background-color: #1b4332;
            border-color: #1b4332;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #143225;
            border-color: #143225;
        }
        .logo-container {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px auto;
            background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(27, 67, 50, 0.2);
            border: 3px solid #d4a373; /* Detalle tono miel dorada */
        }
    </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

<div class="container" style="max-width: 400px;" x-data="loginApp()">
    <div class="card bg-white border-0">
        <div class="card-body p-4 p-md-5">
            
            <!-- Logotipo Visual Integrado -->
            <div class="text-center mb-4">
                <div class="logo-container">
                    <span style="font-size: 32px;">🌿</span>
                </div>
                <h4 class="fw-bold mb-1" style="color: #1b4332;">Raíz & Esencia</h4>
                <span class="badge px-3 py-1 text-uppercase" style="background-color: #d4a373; color: #fff; font-size: 11px; letter-spacing: 1px;">Distribuidora Oficial</span>
            </div>

            <template x-if="errorMsg">
                <div class="alert alert-danger p-2 small text-center rounded-3 shadow-sm" x-text="errorMsg"></div>
            </template>

            <form @submit.prevent="login()">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Usuario / Email</label>
                    <input type="email" class="form-control py-2" x-model="email" required placeholder="admin@distribuidora.com">
                </div>

                <!-- Input de Contraseña con el "Ojito" interactivo -->
                <div class="mb-4">
                    <label class="form-label small fw-semibold text-secondary">Contraseña</label>
                    <div class="input-group">
                        <input :type="mostrarPassword ? 'text' : 'password'" class="form-control py-2" x-model="password" required placeholder="••••••••">
                        <button class="btn btn-outline-secondary border" type="button" @click="mostrarPassword = !mostrarPassword" style="border-color: #dee2e6 !important;">
                            <span x-text="mostrarPassword ? '👁️‍🗨️' : '👁️'"></span>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-semibold py-2 shadow-sm" :disabled="loading">
                    <span x-show="!loading">Ingresar al Panel</span>
                    <span x-show="loading" class="spinner-border spinner-border-sm"></span>
                </button>
            </form>
            
            <div class="text-center mt-4">
                <small class="text-muted" style="font-size: 12px;">Gestión Comercial • Reino & Sandra Marzzan</small>
            </div>
        </div>
    </div>
</div>

<script>
function loginApp() {
    return {
        email: '',
        password: '',
        mostrarPassword: false, // Estado para el ojito de visibilidad
        errorMsg: '',
        loading: false,
        async login() {
            this.loading = true;
            this.errorMsg = '';
            
            try {
                const response = await fetch(`${CONFIG.API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 
                        'Accept': 'application/json',
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify({
                        email: this.email,
                        password: this.password
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || 'Credenciales inválidas');

                // 1. Guardamos el token
                localStorage.setItem('jwt_token', data.access_token);
                
                // 2. Guardamos el objeto del usuario
                if (data.usuario) {
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));
                }

                // 3. Redirección según rol
                const rol = data.usuario ? data.usuario.rol : 'experto';
                
                if (rol === 'admin') {
                    window.location.href = 'dashboard.html';
                } else {
                    window.location.href = 'dashboard_experto.html';
                }

            } catch (err) {
                this.errorMsg = err.message;
            } finally {
                this.loading = false;
            }
        }
    }
}
</script>
</body>
</html>
