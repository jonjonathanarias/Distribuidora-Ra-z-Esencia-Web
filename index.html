<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | REINO & Sandra Marzzan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="js/config.js"></script>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

<div class="container" style="max-width: 400px;" x-data="loginApp()">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <h4 class="fw-bold text-primary mb-1">Distribuidora</h4>
                <span class="badge bg-secondary">Raíz & Esencia</span>
            </div>

            <template x-if="errorMsg">
                <div class="alert alert-danger p-2 small text-center" x-text="errorMsg"></div>
            </template>

            <form @submit.prevent="login()">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Usuario / Email</label>
                    <input type="email" class="form-control" x-model="email" required placeholder="admin@distribuidora.com">
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold text-secondary">Contraseña</label>
                    <input type="password" class="form-control" x-model="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-semibold" :disabled="loading">
                    <span x-show="!loading">Ingresar al Panel</span>
                    <span x-show="loading" class="spinner-border spinner-border-sm"></span>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
function loginApp() {
    return {
        email: '',
        password: '',
        errorMsg: '',
        loading: false,
        async login() {
            this.loading = true;
            this.errorMsg = '';
            
            try {
                const response = await fetch(`${CONFIG.API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 
                        'Accept': 'application/json',
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify({
                        email: this.email,
                        password: this.password
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || 'Credenciales inválidas');

                // 1. Guardamos el token (usando la clave estandarizada 'jwt_token')
                localStorage.setItem('jwt_token', data.access_token);
                
                // 2. Guardamos el objeto completo del usuario (incluyendo su rol y nombre)
                if (data.usuario) {
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));
                }

                // 3. Redirección basada en el rol devuelto por la base de datos
                const rol = data.usuario ? data.usuario.rol : 'experto';
                
                if (rol === 'admin') {
                    window.location.href = 'dashboard.html'; // Panel de administración general
                } else {
                    window.location.href = 'dashboard_experto.html'; // Panel exclusivo de la experta
                }

            } catch (err) {
                this.errorMsg = err.message;
            } finally {
                this.loading = false;
            }
        }
    }
}
</script>
</body>
</html>
