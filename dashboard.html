<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Distribuidora Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="js/config.js"></script>
</head>
<body class="bg-light" x-data="dashboardApp()" x-init="init()">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">Raíz & Esencia</a>
        <div class="d-flex align-items-center gap-3">
            <a href="cuenta-corriente.html" class="btn btn-outline-light btn-sm">Cuentas Corrientes</a>
            <button class="btn btn-light btn-sm fw-semibold" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row g-4">
        <!-- Cierre Quincenal -->
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white fw-bold py-3 text-primary">Cierre Quincenal (Márgenes)</div>
                <div class="card-body">
                    <form @submit.prevent="ejecutarQuincenal()">
                        <div class="mb-3">
                            <label class="form-label small">ID del Experto/a</label>
                            <input type="number" class="form-control" x-model="quincenal.expertoId" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small">Monto PSD Marzzan ($)</label>
                            <input type="number" step="0.01" class="form-control" x-model="quincenal.montoPSD" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small">Unidades Reino</label>
                            <input type="number" class="form-control" x-model="quincenal.unidadesReino" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-semibold">Procesar Cierre Quincenal</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Cierre Mensual -->
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white fw-bold py-3 text-success">Cierre Mensual (Comisiones)</div>
                <div class="card-body">
                    <form @submit.prevent="ejecutarMensual()">
                        <div class="mb-3">
                            <label class="form-label small">ID Líder</label>
                            <input type="number" class="form-control" x-model="mensual.liderId" required>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small">Unidades Equipo</label>
                                <input type="number" class="form-control" x-model="mensual.unidadesEquipo" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label small">Facturación Neta ($)</label>
                                <input type="number" step="0.01" class="form-control" x-model="mensual.facturacionNeta" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-semibold">Liquidar Comisión 10%</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Panel de Resultado de Auditoría -->
        <div class="col-12" x-show="resultado">
            <div class="card shadow-sm border-0 border-start border-4" :class="resultado.status === 'success' ? 'border-success' : 'border-danger'">
                <div class="card-body">
                    <h5 class="fw-bold" x-text="resultado.mensaje"></h5>
                    <div class="mt-2" x-show="resultado.experto">
                        <span class="badge bg-secondary" x-text="'Margen: ' + (resultado.experto?.margen_guardado || '-')"></span>
                        <span class="badge bg-info text-dark" x-text="'Estado Reino: ' + (resultado.experto?.estado_reino_guardado || '-')"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function dashboardApp() {
    return {
        quincenal: { expertoId: 4, montoPSD: 45000, unidadesReino: 4 },
        mensual: { liderId: 4, unidadesEquipo: 120, facturacionNeta: 350000 },
        resultado: null,
        init() {
            verificarSesion();
        },
        async ejecutarQuincenal() {
            try {
                const url = `${CONFIG.API_BASE_URL}/red/cierre-quincenal/${this.quincenal.expertoId}?monto_psd_marzzan=${this.quincenal.montoPSD}&unidades_reino=${this.quincenal.unidadesReino}`;
                const res = await fetch(url, { method: 'POST', headers: getAuthHeaders() });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Error en cierre quincenal');
                this.resultado = data;
            } catch (err) {
                alert(err.message);
            }
        },
        async ejecutarMensual() {
            try {
                const url = `${CONFIG.API_BASE_URL}/red/cierre-mensual/${this.mensual.liderId}?unidades_equipo_total=${this.mensual.unidadesEquipo}&unidades_personales_c1=10&unidades_personales_c2=10&facturacion_neta_equipo=${this.mensual.facturacionNeta}`;
                const res = await fetch(url, { method: 'POST', headers: getAuthHeaders() });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Error en cierre mensual');
                this.resultado = data;
            } catch (err) {
                alert(err.message);
            }
        }
    }
}
</script>
</body>
</html>
