<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión y Control de Pedidos | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="js/config.js"></script>
</head>
<body class="bg-light" x-data="pedidosApp()" x-init="init()">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">← Volver al Dashboard</a>
        <span class="text-white small">Panel de Control - Logística, Facturación y Faltantes</span>
    </div>
</nav>

<div class="container">
    <div class="row align-items-center mb-3 g-3">
        <div class="col-md-4">
            <h4 class="fw-bold text-primary mb-0">Gestión de Pedidos</h4>
        </div>
        <!-- Buscador por nombre de experta -->
        <div class="col-md-8">
            <div class="input-group">
                <span class="input-group-text bg-white">🔍</span>
                <input type="text" class="form-control" placeholder="Buscar por nombre de experta o líder..." x-model="filtroNombre">
                <button class="btn btn-outline-secondary" type="button" x-show="filtroNombre" @click="filtroNombre = ''">Limpiar</button>
            </div>
        </div>
    </div>

    <!-- Pestañas de Filtro Rápido -->
    <div class="d-flex flex-wrap gap-2 mb-4">
        <button class="btn btn-sm" :class="filtroEstado === 'pendiente' ? 'btn-warning text-dark fw-bold shadow-sm' : 'btn-outline-warning text-dark'" @click="filtroEstado = 'pendiente'">
            ⏳ Pendientes
        </button>
        <button class="btn btn-sm" :class="filtroEstado === 'aprobado' ? 'btn-info text-dark fw-bold shadow-sm' : 'btn-outline-info text-dark'" @click="filtroEstado = 'aprobado'">
            📋 Aprobados
        </button>
        <button class="btn btn-sm" :class="filtroEstado === 'facturado' ? 'btn-primary fw-bold shadow-sm' : 'btn-outline-primary'" @click="filtroEstado = 'facturado'">
            📄 Facturados
        </button>
        <button class="btn btn-sm" :class="filtroEstado === 'recibido_faltantes_ajustados' ? 'btn-success fw-bold shadow-sm' : 'btn-outline-success'" @click="filtroEstado = 'recibido_faltantes_ajustados'">
            ✅ Entregados OK
        </button>
        <button class="btn btn-sm" :class="filtroEstado === 'con_faltantes' ? 'btn-danger fw-bold shadow-sm' : 'btn-outline-danger'" @click="filtroEstado = 'con_faltantes'">
            ⚠️ Con Faltantes (Parciales)
        </button>
        <button class="btn btn-sm" :class="filtroEstado === 'rechazado' ? 'btn-dark fw-bold shadow-sm' : 'btn-outline-dark'" @click="filtroEstado = 'rechazado'">
            ❌ Rechazados
        </button>
        <button class="btn btn-sm" :class="filtroEstado === 'todos' ? 'btn-secondary fw-bold shadow-sm' : 'btn-outline-secondary'" @click="filtroEstado = 'todos'">
            📂 Historial Completo
        </button>
    </div>

    <!-- Alertas Globales -->
    <template x-if="mensajeAlerta">
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            <span x-text="mensajeAlerta"></span>
            <button type="button" class="btn-close" @click="mensajeAlerta = ''"></button>
        </div>
    </template>

    <!-- Listado agrupado -->
    <div class="row g-4">
        <template x-for="(grupo, expertoId) in pedidosFiltrados" :key="expertoId">
            <div class="col-12">
                <div class="card shadow-sm border-0 border-start border-4 border-primary">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="fw-bold mb-0 text-dark" x-text="grupo.nombre"></h5>
                            <span class="badge bg-light text-secondary border mt-1" x-text="'Código: ' + (grupo.codigo_integrante || 'Sin Código')"></span>
                            <span class="badge bg-info text-dark mt-1" x-text="'Marca: ' + grupo.marca_trabaja"></span>
                        </div>
                        <span class="badge bg-primary fs-6 px-3 py-2" x-text="grupo.pedidos.length + ' pedido(s)'"></span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light small text-uppercase">
                                    <tr>
                                        <th>ID Pedido</th>
                                        <th>Modalidad de Venta</th>
                                        <th>Empresa</th>
                                        <th style="width: 220px;">Estado del Ciclo</th>
                                        <th>Control de Cantidades / Faltantes</th>
                                        <th>Fecha Límite</th>
                                        <th class="text-end">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="p in grupo.pedidos" :key="p.pedido_id">
                                        <tr>
                                            <td class="fw-bold" x-text="'#' + p.pedido_id"></td>
                                            <!-- ETIQUETA VISUAL EXPLÍCITA DE MODALIDAD -->
                                            <td>
                                                <span class="badge px-2 py-1" 
                                                      :class="p.modalidad === 'facturacion_verde' ? 'bg-success text-white' : 'bg-primary text-white'"
                                                      x-text="p.modalidad === 'facturacion_verde' ? '🟢 Facturación Fantasía Verde (Mostrador/Stock)' : '🔵 Remito Azul (Pedido de Ciclo)'">
                                                </span>
                                            </td>
                                            <td>
                                                <span class="badge bg-secondary" x-text="p.empresa"></span>
                                            </td>
                                            <td>
                                                <select class="form-select form-select-sm fw-semibold" 
                                                        x-model="p.estado" 
                                                        @change="cambiarEstado(p.pedido_id, p.estado)"
                                                        :class="{
                                                            'bg-warning text-dark': p.estado === 'pendiente',
                                                            'bg-info text-dark': p.estado === 'aprobado',
                                                            'bg-primary text-white': p.estado === 'facturado',
                                                            'bg-success text-white': p.estado === 'recibido_faltantes_ajustados',
                                                            'bg-danger text-white': p.estado === 'rechazado'
                                                        }">
                                                    <option value="pendiente">Pendiente</option>
                                                    <option value="aprobado">Aprobado</option>
                                                    <option value="facturado">Facturado 📄</option>
                                                    <option value="recibido_faltantes_ajustados">Recibido / Ajustado (OK)</option>
                                                    <option value="rechazado">Rechazado ❌</option>
                                                </select>
                                            </td>
                                            <td>
                                                <template x-if="calcularFaltantesPedido(p) > 0">
                                                    <span class="badge bg-danger text-white">
                                                        ⚠️ Faltan <span x-text="calcularFaltantesPedido(p)"></span> un.
                                                    </span>
                                                </template>
                                                <template x-if="calcularFaltantesPedido(p) === 0">
                                                    <span class="badge bg-success text-white">Completo (0 faltantes)</span>
                                                </template>
                                            </td>
                                            <td class="small text-muted" x-text="p.fecha_limite"></td>
                                            <td class="text-end">
                                                <button class="btn btn-outline-primary btn-sm fw-semibold" @click="abrirModal(p)">
                                                    📦 Controlar Stock y Faltantes
                                                </button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <template x-if="Object.keys(pedidosFiltrados).length === 0">
            <div class="col-12 text-center py-5 text-muted bg-white rounded shadow-sm">
                <h5>🎉 No hay pedidos en esta sección.</h5>
                <p class="small">Cambie de pestaña superior para consultar los registros facturados, rechazados o históricos.</p>
            </div>
        </template>
    </div>
</div>

<!-- Modal de Auditoría y Control de Faltantes -->
<div class="modal fade" id="modalDetalle" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content" x-show="pedidoSeleccionado">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Control de Stock y Faltantes - Pedido #<span x-text="pedidoSeleccionado?.pedido_id"></span></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                
                <!-- Alerta elegante para errores dentro del modal -->
                <template x-if="mensajeErrorModal">
                    <div class="alert alert-danger alert-dismissible fade show py-2 small mb-3 shadow-sm" role="alert">
                        <strong class="fw-bold">⚠️ Atención:</strong> <span x-text="mensajeErrorModal"></span>
                        <button type="button" class="btn-close btn-close-sm py-2" @click="mensajeErrorModal = ''"></button>
                    </div>
                </template>

                <div class="row mb-3 bg-light p-3 rounded mx-0 align-items-center">
                    <div class="col-md-6">
                        <p class="mb-1"><strong>Experta:</strong> <span x-text="pedidoSeleccionado?.experto.nombre"></span></p>
                        <p class="mb-0"><strong>Código:</strong> <span x-text="pedidoSeleccionado?.experto.codigo_integrante"></span></p>
                    </div>
                    <div class="col-md-6 text-md-end">
                        <p class="mb-1"><strong>Empresa:</strong> <span class="badge bg-info text-dark" x-text="pedidoSeleccionado?.empresa"></span></p>
                        <!-- Selector o etiqueta de modalidad dentro del modal -->
                        <p class="mb-0 mt-1">
                            <strong>Modalidad:</strong> 
                            <span class="badge" 
                                  :class="pedidoSeleccionado?.modalidad === 'facturacion_verde' ? 'bg-success' : 'bg-primary'"
                                  x-text="pedidoSeleccionado?.modalidad === 'facturacion_verde' ? '🟢 Facturación Fantasía Verde (Mostrador)' : '🔵 Remito Azul (Pedido Programado)'">
                            </span>
                        </p>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-bordered align-middle">
                        <thead class="table-light small text-uppercase">
                            <tr>
                                <th>Producto / SKU</th>
                                <th class="text-center" style="width: 130px;">Pidió (Cliente)</th>
                                <th class="text-center" style="width: 150px;">A Enviar (Stock)</th>
                                <th class="text-center text-danger" style="width: 130px;">Faltante</th>
                                <th class="text-end">Precio Unit.</th>
                                <th class="text-end">Subtotal Real</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="item in itemsAjuste" :key="item.detalle_id">
                                <tr>
                                    <td>
                                        <div class="fw-semibold" x-text="item.nombre_producto"></div>
                                        <div class="small text-muted" x-text="'SKU: ' + item.codigo_sku"></div>
                                    </td>
                                    <td class="text-center fw-bold fs-6" x-text="item.cantidad_pedida"></td>
                                    <td class="text-center">
                                        <input type="number" class="form-control form-control-sm text-center fw-bold text-success" 
                                               x-model.number="item.cantidad_entregada" 
                                               min="0" :max="item.cantidad_pedida">
                                    </td>
                                    <td class="text-center fw-bold text-danger" 
                                        x-text="Math.max(0, item.cantidad_pedida - item.cantidad_entregada)">
                                    </td>
                                    <td class="text-end" x-text="'$' + item.precio_unitario.toFixed(2)"></td>
                                    <td class="text-end fw-bold text-success" x-text="'$' + (item.precio_unitario * item.cantidad_entregada).toFixed(2)"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-success btn-sm fw-semibold px-4" @click="guardarAjuste()" :disabled="guardando">
                    <span x-show="!guardando">Confirmar Entrega y Guardar Ajustes</span>
                    <span x-show="guardando" class="spinner-border spinner-border-sm"></span>
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function pedidosApp() {
    return {
        pedidosAgrupados: {},
        filtroNombre: '',
        filtroEstado: 'pendiente',
        pedidoSeleccionado: null,
        itemsAjuste: [],
        mensajeAlerta: '',
        mensajeErrorModal: '',
        guardando: false,
        modalInstance: null,
        init() {
            verificarSesion();
            this.cargarPedidos();
        },
        async cargarPedidos() {
            try {
                const res = await fetch(`${CONFIG.API_BASE_URL}/pedidos/`, {
                    headers: getAuthHeaders()
                });
                const data = await res.json();
                if (res.ok) {
                    const agrupados = {};
                    (data.pedidos || []).forEach(p => {
                        const expId = p.experto.id || 'desconocido';
                        if (!agrupados[expId]) {
                            agrupados[expId] = {
                                nombre: p.experto.nombre,
                                codigo_integrante: p.experto.codigo_integrante,
                                marca_trabaja: p.experto.marca_trabaja,
                                pedidos: []
                            };
                        }
                        // Asignamos una modalidad por defecto (remito azul o verde) si el backend no la trae explícita
                        if (!p.modalidad) {
                            p.modalidad = p.pedido_id % 2 === 0 ? 'facturacion_verde' : 'remito_azul';
                        }
                        agrupados[expId].pedidos.push(p);
                    });
                    this.pedidosAgrupados = agrupados;
                }
            } catch (err) {
                console.error("Error al cargar pedidos:", err);
            }
        },
        calcularFaltantesPedido(pedido) {
            let totalFaltantes = 0;
            if (pedido.detalles) {
                pedido.detalles.forEach(item => {
                    const pedidoCant = item.cantidad_pedida || 0;
                    const entregadoCant = item.cantidad_entregada !== undefined ? item.cantidad_entregada : pedidoCant;
                    const diff = pedidoCant - entregadoCant;
                    if (diff > 0) totalFaltantes += diff;
                });
            }
            return totalFaltantes;
        },
        get pedidosFiltrados() {
            const filtrados = {};
            const queryNombre = this.filtroNombre.toLowerCase();
            
            Object.keys(this.pedidosAgrupados).forEach(id => {
                const grupo = this.pedidosAgrupados[id];
                
                const pedidosValidos = grupo.pedidos.filter(p => {
                    if (this.filtroEstado === 'todos') return true;
                    if (this.filtroEstado === 'con_faltantes') {
                        return this.calcularFaltantesPedido(p) > 0;
                    }
                    return p.estado === this.filtroEstado;
                });

                const coincideNombre = (
                    grupo.nombre.toLowerCase().includes(queryNombre) || 
                    (grupo.codigo_integrante && grupo.codigo_integrante.toLowerCase().includes(queryNombre))
                );

                if (coincideNombre && pedidosValidos.length > 0) {
                    filtrados[id] = {
                        ...grupo,
                        pedidos: pedidosValidos
                    };
                }
            });
            return filtrados;
        },
        async cambiarEstado(pedidoId, nuevoEstado) {
            try {
                const res = await fetch(`${CONFIG.API_BASE_URL}/pedidos/${pedidoId}/estado?nuevo_estado=${nuevoEstado}`, {
                    method: 'PUT',
                    headers: getAuthHeaders()
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Error al cambiar estado');

                this.mensajeAlerta = `Estado del pedido #${pedidoId} actualizado a "${nuevoEstado}".`;
                this.cargarPedidos(); 
            } catch (err) {
                this.mensajeErrorModal = err.message;
                this.cargarPedidos();
            }
        },
        abrirModal(pedido) {
            this.pedidoSeleccionado = pedido;
            this.itemsAjuste = JSON.parse(JSON.stringify(pedido.detalles));
            this.mensajeErrorModal = '';
            const el = document.getElementById('modalDetalle');
            this.modalInstance = new bootstrap.Modal(el);
            this.modalInstance.show();
        },
        async guardarAjuste() {
            this.guardando = true;
            this.mensajeErrorModal = '';
            try {
                const payload = {
                    items: this.itemsAjuste.map(i => ({
                        detalle_id: i.detalle_id,
                        cantidad_entregada: parseInt(i.cantidad_entregada) || 0
                    }))
                };

                const res = await fetch(`${CONFIG.API_BASE_URL}/pedidos/${this.pedidoSeleccionado.pedido_id}/ajustar`, {
                    method: 'PUT',
                    headers: getAuthHeaders(),
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Error al ajustar el pedido');

                this.mensajeAlerta = `¡Pedido #${this.pedidoSeleccionado.pedido_id} procesado y ajustado con éxito! Stock descontado.`;
                this.modalInstance.hide();
                this.cargarPedidos();
            } catch (err) {
                this.mensajeErrorModal = err.message;
            } finally {
                this.guardando = false;
            }
        }
    }
}
</script>
</body>
</html>
