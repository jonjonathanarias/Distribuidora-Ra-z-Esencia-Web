<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pedidos | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="js/config.js"></script>
</head>
<body class="bg-light" x-data="pedidosApp()" x-init="init()">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">← Volver al Dashboard</a>
        <span class="text-white small">Panel de Control - Pedidos de la Red</span>
    </div>
</nav>

<div class="container">
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h5 class="fw-bold mb-0 text-primary">Listado General de Pedidos Recibidos</h5>
            <span class="badge bg-secondary fs-6" x-text="'Total: ' + pedidos.length"></span>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light small text-uppercase">
                        <tr>
                            <th>ID</th>
                            <th>Experta / Líder</th>
                            <th>Empresa</th>
                            <th>Estado</th>
                            <th>Fecha Límite</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="p in pedidos" :key="p.pedido_id">
                            <tr>
                                <td class="fw-bold" x-text="'#' + p.pedido_id"></td>
                                <div>
                                    <td class="fw-semibold" x-text="p.experto.nombre"></td>
                                    <div class="small text-muted" x-text="p.experto.codigo_integrante"></div>
                                </div>
                                <td>
                                    <span class="badge bg-info text-dark" x-text="p.empresa"></span>
                                </td>
                                <td>
                                    <span class="badge" 
                                          :class="{
                                              'bg-warning text-dark': p.estado === 'pendiente',
                                              'bg-success': p.estado === 'recibido_faltantes_ajustados',
                                              'bg-secondary': p.estado === 'procesado'
                                          }" x-text="p.estado"></span>
                                </td>
                                <td class="small text-muted" x-text="p.fecha_limite"></td>
                                <td class="text-end">
                                    <button class="btn btn-outline-primary btn-sm" @click="verDetalle(p)">Ver Detalles</button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal para ver el detalle de los productos del pedido -->
<div class="modal fade" id="modalDetalle" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content" x-show="pedidoSeleccionado">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Detalle del Pedido #<span x-text="pedidoSeleccionado?.pedido_id"></span></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p><strong>Experta:</strong> <span x-text="pedidoSeleccionado?.experto.nombre"></span> (<span x-text="pedidoSeleccionado?.experto.codigo_integrante"></span>)</p>
                <hr>
                <h6 class="fw-bold">Productos Solicitados:</h6>
                <ul class="list-group list-group-flush">
                    <template x-for="item in pedidoSeleccionado?.detalles">
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <div>
                                <span class="fw-semibold" x-text="item.nombre_producto"></span>
                                <div class="small text-muted" x-text="'SKU: ' + item.codigo_sku"></div>
                            </div>
                            <div class="text-end">
                                <span class="badge bg-primary rounded-pill" x-text="'Cant: ' + item.cantidad_pedida"></span>
                                <div class="small fw-bold text-success mt-1" x-text="'$' + (item.precio_unitario * item.cantidad_pedida).toFixed(2)"></div>
                            </div>
                        </li>
                    </template>
                </ul>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function pedidosApp() {
    return {
        pedidos: [],
        pedidoSeleccionado: null,
        init() {
            verificarSesion();
            this.cargarPedidos();
        },
        async cargarPedidos() {
            try {
                const res = await fetch(`${CONFIG.API_BASE_URL}/pedidos/`, {
                    headers: getAuthHeaders()
                });
                const data = await res.json();
                if (res.ok) {
                    this.pedidos = data.pedidos || [];
                }
            } catch (err) {
                console.error("Error al cargar pedidos:", err);
            }
        },
        verDetalle(pedido) {
            this.pedidoSeleccionado = pedido;
            const modal = new bootstrap.Modal(document.getElementById('modalDetalle'));
            modal.show();
        }
    }
}
</script>
</body>
</html>
